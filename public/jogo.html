<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumo ao Milhão — Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- Fundo de palco (feixes de refletores) -->
<div class="palco" aria-hidden="true">
  <div class="feixe a"></div><div class="feixe b"></div><div class="feixe c"></div><div class="feixe d"></div>
</div>

<section id="jogo" class="tela f0">
  <div class="flash-faixa" id="flash-faixa"></div>

  <div class="barra-topo">
    <div class="marca">Rumo ao Milhão</div>
    <button class="btn mini btn-sair" id="btn-sair">Sair</button>
  </div>

  <!-- Etapa 2: partida -->
  <div id="etapa-jogo" hidden>
    <div class="principal">
      <div class="cabecalho">
        <div class="led nome"><small>Participante</small><div class="valor" id="j-nome"></div></div>
        <div class="centro">
          <div class="timer-linha">
            <!-- Ampulheta: a areia desce conforme o tempo da pergunta passa -->
            <svg class="ampulheta" viewBox="0 0 40 60" aria-hidden="true">
              <defs><clipPath id="amp-vidro"><path d="M6 4H34V10C34 20 22 27 22 30C22 33 34 40 34 50V56H6V50C6 40 18 33 18 30C18 27 6 20 6 10Z"/></clipPath></defs>
              <g clip-path="url(#amp-vidro)" fill="currentColor">
                <rect id="amp-cima" x="0" y="6" width="40" height="24" opacity=".9"/>
                <rect id="amp-baixo" x="0" y="56" width="40" height="0" opacity=".9"/>
              </g>
              <line id="amp-fio" class="amp-fio" x1="20" y1="29" x2="20" y2="56" stroke="currentColor" stroke-width="1.6"/>
              <path d="M6 4H34V10C34 20 22 27 22 30C22 33 34 40 34 50V56H6V50C6 40 18 33 18 30C18 27 6 20 6 10Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="M3 4H37M3 56H37" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
            </svg>
            <div class="timer-num" id="j-timer">90</div>
          </div>
          <div class="valendo" id="j-valendo">Valendo <b>0</b></div>
        </div>
        <div class="led" id="led-placar">
          <small>Placar</small><div class="valor" id="j-placar">0</div>
          <div class="ganho" id="j-ganho"></div>
        </div>
      </div>

      <div class="faixas-barra" id="j-barra"></div>
      <div class="seg-rotulos" id="j-rotulos"></div>

      <div class="letreiro">
        <div class="ordem" id="j-ordem"></div>
        <div class="enunciado" id="j-enun"></div>
      </div>

      <div class="alts" id="j-alts"></div>

      <div class="zona-acao" id="j-acao"></div>
    </div>

    <aside class="lateral">
      <h3>Perguntas</h3>
      <ol id="j-lista"></ol>
    </aside>
  </div>

  <!-- Etapa 3: final -->
  <div id="etapa-fim" hidden>
    <div class="fim-titulo">Fim de jogo</div>
    <div class="fim-nome" id="fim-nome"></div>
    <div class="led"><small>Pontuação final</small><div class="valor" id="fim-pontos">0</div></div>
    <div class="fim-acertos"><b id="fim-acertos">0</b> de <span id="fim-total">0</span> acertos</div>
    <div class="fim-acertos">Total acumulado: <b id="fim-acum">0</b></div>
    <div class="fim-botoes">
      <button class="btn cheio" id="btn-voltar">Voltar ao início</button>
    </div>
  </div>
</section>

<script src="common.js"></script>
<script>
/* Etapas desta página: 'jogo' (partida) e 'fim' (resultado) */
function mostrarEtapa(e){
  $('etapa-jogo').hidden = e !== 'jogo';
  $('etapa-fim').hidden = e !== 'fim';
}

/* Sai da partida e volta à página inicial (os pontos já ganhos ficam guardados no servidor) */
function sair(){
  pararTimer();
  jogo.sessao++;           // invalida qualquer sequência assíncrona em andamento
  location.href = 'index.html';
}

/* ==========================================================
   JOGO
   O servidor conduz a partida: entrega uma pergunta por vez (sem a resposta certa),
   mede o tempo, confere a resposta e calcula os pontos. Esta página só mostra o resultado.
   ========================================================== */
const jogo = {
  sessao:0,          // contador para cancelar sequências assíncronas
  dia:1,             // dia das perguntas desta partida (fixado ao abrir, não muda na virada)
  nome:'',
  matricula:'',      // chave do jogador no banco
  acumulado:0,       // total de pontos da matrícula (vindo do banco)
  total:0,           // quantidade de perguntas da partida
  idx:0,             // pergunta atual
  pergunta:null,     // { enunciado, alts } da pergunta atual
  fimServidor:false, // o servidor encerrou a partida (errou, tempo esgotado ou última pergunta)
  placar:0,
  acertos:0,
  status:[],         // por pergunta: 'pendente' | 'acertou' | 'errou' | 'tempo'
  ganhos:[],         // pontos ganhos por pergunta
  fase:'ociosa',     // 'pergunta' | 'suspense' | 'revelado' | 'carregando' | 'erro' | 'fim'
  sel:-1,            // alternativa selecionada
  faixa:0,           // faixa atual do timer
  t0:0,              // instante de início do timer
  raf:0
};

function iniciarPartida(nome, r){
  jogo.sessao++;
  jogo.nome = nome;
  jogo.total = totalPerguntas = r.total;
  jogo.pergunta = null;
  jogo.fimServidor = false;
  jogo.placar = 0;
  jogo.acertos = 0;
  jogo.status = Array(jogo.total).fill('pendente');
  jogo.ganhos = Array(jogo.total).fill(0);
  $('j-nome').textContent = nome;
  $('j-placar').textContent = '0';
  montarBarraFaixas();
  mostrarEtapa('jogo');
  abrirPergunta(0);
}

/* Barra do timer: 3 segmentos, um por faixa */
function montarBarraFaixas(){
  $('j-barra').innerHTML = [0,1,2].map(i => `<div class="seg s${i}" id="seg${i}"><i></i></div>`).join('');
  $('j-rotulos').innerHTML = [0,1,2].map(i => `<span id="rot${i}">Faixa ${i+1} · ${fmt(valorFaixa(i))}</span>`).join('');
}

function mostrarPergunta(){
  const p = jogo.pergunta;
  jogo.fase = 'pergunta';
  jogo.sel = -1;
  $('j-ordem').textContent = `Pergunta ${jogo.idx+1} de ${jogo.total}`;
  $('j-enun').textContent = p.enunciado;
  $('j-alts').innerHTML = p.alts.map((a,i) => `
    <button class="alt" data-i="${i}">
      <span class="alt-in"><span class="letra">${LETRAS[i]}</span><span class="txt">${esc(a)}</span></span>
    </button>`).join('');
  $('j-acao').innerHTML = '';
  renderLateral();
  // reinicia timer
  jogo.faixa = -1;
  jogo.t0 = performance.now();
  aplicarFaixa(0, false);
  pararTimer();
  jogo.raf = requestAnimationFrame(tick);
}

/* Abertura de cada pergunta: animação da ampulheta com a pergunta escondida. Só quando ela chega ao canto o
   servidor entrega a pergunta e liga o relógio — assim ninguém ganha tempo de leitura nem perde tempo na animação. */
async function abrirPergunta(idx){
  const sessao = jogo.sessao;
  jogo.fase = 'carregando';
  jogo.idx = idx;
  jogo.sel = -1;
  $('etapa-jogo').classList.add('aguardando');
  $('j-acao').innerHTML = '';
  renderLateral();
  zerarTimerVisual();
  await animarAmpulheta(idx);
  if(sessao !== jogo.sessao) return;
  let r;
  try { r = await comRetry(() => api('POST', '/api/partida/proxima', { matricula:jogo.matricula, dia:jogo.dia })); }
  catch(e){ if(sessao === jogo.sessao) erroPartida(e); return; }
  if(sessao !== jogo.sessao) return;
  jogo.idx = r.idx;
  jogo.pergunta = r.pergunta;
  $('etapa-jogo').classList.remove('aguardando');
  mostrarPergunta();
}

/* Contador, barra e "Valendo" parados no começo, enquanto o relógio não foi ligado */
function zerarTimerVisual(){
  jogo.t0 = 0;
  $('jogo').classList.remove('urgente');
  aplicarFaixa(0, false);
  $('j-timer').textContent = config.tempo;
  for(let i = 0; i < 3; i++) document.querySelector(`#seg${i} i`).style.width = '100%';
  areia(0);
}

/* Areia da ampulheta do canto: fr = fração do tempo gasto (0 = tudo em cima, 1 = tudo embaixo) */
function areia(fr){
  $('amp-cima').setAttribute('y', 6 + 24 * fr);
  $('amp-cima').setAttribute('height', 24 * (1 - fr));
  $('amp-baixo').setAttribute('y', 56 - 26 * fr);
  $('amp-baixo').setAttribute('height', 26 * fr);
  $('amp-fio').setAttribute('y2', 56 - 26 * fr);
  $('amp-fio').style.opacity = fr < 1 ? 1 : 0;
}

/* ---------- Ampulheta de abertura ----------
   1) surge de cabeça para baixo no meio da tela, dentro de uma moldura;  2) gira e "cai" com impacto
   (a areia começa a escorrer, a moldura treme e dá um clarão);  3) vai para o lugar dela, ao lado do contador.
   Devolve uma promessa que se resolve quando termina (ou é cancelada). */
const AMP_DURACAO = 4200;
let ampToken = 0, ampAnims = [];
function limparAmpulheta(){
  ampToken++;
  ampAnims.forEach(a => a.cancel());
  ampAnims = [];
  document.querySelectorAll('.amp-voo, .amp-cena').forEach(e => e.remove());
  const real = document.querySelector('.timer-linha .ampulheta');
  if(real) real.style.visibility = '';
}
function animarAmpulheta(idx){
  limparAmpulheta();
  const real = document.querySelector('.timer-linha .ampulheta');
  const r = real.getBoundingClientRect();
  if(!real.animate || !r.width || matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve();
  const D = AMP_DURACAO, token = ampToken;
  const alvo = Math.min(innerWidth, innerHeight) * .40;   // altura da ampulheta no centro da tela

  // cena: fundo escurecido, moldura (título em cima, legenda embaixo; a ampulheta voa por cima, no centro) e clarão
  const cena = document.createElement('div');
  cena.className = 'amp-cena';
  cena.innerHTML = `<div class="amp-moldura" style="width:${alvo * 1.3}px;height:${alvo + 120}px">
      <div class="amp-faixa-txt amp-titulo">Pergunta ${idx + 1} de ${jogo.total}</div>
      <div class="amp-faixa-txt amp-legenda">Você tem <b>${config.tempo}</b> segundos</div>
    </div><div class="amp-clarao"></div>`;
  $('jogo').appendChild(cena);

  // ampulheta que voa: cópia da do canto (com recorte próprio, pois o original fica escondido)
  const voo = real.cloneNode(true);
  voo.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  voo.querySelector('clipPath').id = 'amp-vidro-voo';
  voo.querySelector('g').setAttribute('clip-path', 'url(#amp-vidro-voo)');
  const [cima, baixo] = voo.querySelectorAll('rect');   // areia toda em cima
  cima.setAttribute('y', 6); cima.setAttribute('height', 24);
  baixo.setAttribute('y', 56); baixo.setAttribute('height', 0);
  voo.classList.add('amp-voo');
  Object.assign(voo.style, { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px' });
  $('jogo').appendChild(voo);
  real.style.visibility = 'hidden';

  const s = alvo / r.height;
  const centro = `translate(${innerWidth / 2 - (r.left + r.width / 2)}px, ${innerHeight / 2 - (r.top + r.height / 2)}px)`;
  const pose = (esc, giro) => `${centro} scale(${s * esc}) rotate(${giro}deg)`;
  const impacto = .44;   // fração da animação em que ela "cai"

  const anims = [
    voo.animate([
      { transform:pose(.5, 180),  opacity:0, offset:0,   easing:'ease-out' },     // surge de cabeça para baixo
      { transform:pose(1, 180),   opacity:1, offset:.10 },
      { transform:pose(1.03, 180), opacity:1, offset:.30, easing:'ease-in' },      // respira, de cabeça para baixo
      { transform:pose(1.06, 200), opacity:1, offset:.36, easing:'ease-in' },      // recuo antes de girar
      { transform:pose(1.18, -14), opacity:1, offset:impacto, easing:'ease-out' }, // gira e passa do ponto: impacto
      { transform:pose(.96, 6),   opacity:1, offset:.48 },
      { transform:pose(1, 0),     opacity:1, offset:.52 },                         // assenta; a areia escorre
      { transform:pose(1, 0),     opacity:1, offset:.70, easing:'ease-in-out' },
      { transform:'translate(0px, 0px) scale(1) rotate(0deg)', opacity:1, offset:1 }   // vai para o canto
    ], { duration:D, fill:'both' }),
    voo.querySelector('.amp-fio').animate([   // o fio de areia só aparece depois do giro
      { opacity:0, offset:0 }, { opacity:0, offset:.5 }, { opacity:1, offset:.54 }, { opacity:1, offset:1 }
    ], { duration:D, fill:'both' }),
    cena.animate([   // fundo e moldura entram, ficam e somem quando a ampulheta sai para o canto
      { opacity:0, offset:0 }, { opacity:1, offset:.07 }, { opacity:1, offset:.70 }, { opacity:0, offset:.92 }, { opacity:0, offset:1 }
    ], { duration:D, fill:'both' }),
    cena.querySelector('.amp-moldura').animate([   // tremor no impacto
      { transform:'translate(0, 0)', offset:0 }, { transform:'translate(0, 0)', offset:impacto },
      { transform:'translate(-12px, 7px)', offset:impacto + .02 }, { transform:'translate(10px, -7px)', offset:impacto + .04 },
      { transform:'translate(-7px, 4px)', offset:impacto + .06 }, { transform:'translate(4px, -2px)', offset:impacto + .08 },
      { transform:'translate(0, 0)', offset:impacto + .10 }, { transform:'translate(0, 0)', offset:1 }
    ], { duration:D, fill:'both' }),
    cena.querySelector('.amp-clarao').animate([   // clarão branco no impacto
      { opacity:0, offset:0 }, { opacity:0, offset:impacto - .01 }, { opacity:.85, offset:impacto + .01 },
      { opacity:0, offset:impacto + .09 }, { opacity:0, offset:1 }
    ], { duration:D, fill:'both' })
  ];
  ampAnims = anims;
  return new Promise(resolve => {
    const fim = () => {
      if(token !== ampToken) return resolve();   // foi cancelada por outra animação ou pelo fim do jogo
      voo.remove(); cena.remove(); real.style.visibility = ''; ampAnims = [];
      resolve();
    };
    anims[0].finished.then(fim, fim);
  });
}

/* ---------- Timer ---------- */
function pararTimer(){ cancelAnimationFrame(jogo.raf); jogo.raf = 0; }

function faixaAtual(decorridoMs){
  const dur = config.tempo * 1000;
  return Math.min(2, Math.floor(decorridoMs / (dur/3)));
}

function tick(){
  if(jogo.fase !== 'pergunta') return;
  const dur = config.tempo * 1000;
  const dec = performance.now() - jogo.t0;
  const rest = Math.max(0, dur - dec);

  $('j-timer').textContent = Math.ceil(rest/1000);
  const vb = document.querySelector('#j-valendo b');
  if(vb) vb.textContent = fmt(valorEm(dec / dur));
  $('jogo').classList.toggle('urgente', rest <= 5000 && rest > 0);

  areia(Math.min(1, dec / dur));   // areia some de cima e se acumula embaixo

  // preenchimento de cada segmento (esvazia da esquerda para a direita)
  const seg = dur/3;
  for(let i=0;i<3;i++){
    const inicio = i*seg, fim = (i+1)*seg;
    const frac = dec >= fim ? 0 : dec <= inicio ? 1 : (fim - dec)/seg;
    document.querySelector(`#seg${i} i`).style.width = (frac*100) + '%';
  }

  const f = faixaAtual(dec);
  if(f !== jogo.faixa) aplicarFaixa(f, true);

  if(rest <= 0){ tempoEsgotado(); return; }
  jogo.raf = requestAnimationFrame(tick);
}

/* Troca de faixa: cor, valor em disputa e flash */
function aplicarFaixa(f, animar){
  jogo.faixa = f;
  const el = $('jogo');
  el.classList.remove('f0','f1','f2');
  el.classList.add('f'+f);
  for(let i=0;i<3;i++){
    $('seg'+i).classList.toggle('ativo', i===f);
    $('rot'+i).classList.toggle('ativo', i===f);
  }
  $('j-valendo').innerHTML = `Valendo <b>${fmt(valorEm(jogo.t0 ? (performance.now() - jogo.t0) / (config.tempo * 1000) : 0))}</b>`;
  if(animar){
    const v = $('j-valendo'), fl = $('flash-faixa');
    v.classList.remove('troca'); fl.classList.remove('vai');
    void v.offsetWidth;
    v.classList.add('troca'); fl.classList.add('vai');
  }
}

/* ---------- Seleção: clicar já responde ---------- */
function clicarAlternativa(i){
  if(jogo.fase !== 'pergunta') return;
  jogo.sel = i;
  confirmarResposta();
}

/* Repete a chamada se a rede falhar (erros respondidos pelo servidor não se repetem) */
async function comRetry(fn){
  for(let t = 0; ; t++){
    try { return await fn(); }
    catch(e){ if(e.status || t >= 2) throw e; await espera(600); }
  }
}

/* Envia a escolha ao servidor (alt = índice; null quando o tempo acabou) → { res } ou { erro } */
function enviarResposta(alt){
  const corpo = { matricula:jogo.matricula, dia:jogo.dia, idx:jogo.idx, alt };
  return comRetry(() => api('POST', '/api/partida/responder', corpo)).then(res => ({ res }), erro => ({ erro }));
}

/* Falha que impede de continuar a partida (os pontos já feitos ficam guardados no servidor) */
function erroPartida(e){
  jogo.fase = 'erro';
  $('j-acao').innerHTML = `<div class="resultado ruim"><div class="msg">${esc(e.message)}</div><div><button class="btn cheio" id="btn-erro">Voltar ao início</button></div></div>`;
}

/* Jogador clicou numa alternativa: congela o timer e envia a resposta; a alternativa pisca enquanto o servidor confere */
async function confirmarResposta(){
  if(jogo.fase !== 'pergunta') return;
  jogo.fase = 'suspense';
  pararTimer();
  $('jogo').classList.remove('urgente');
  const sessao = jogo.sessao;
  const botoes = document.querySelectorAll('#j-alts .alt');
  botoes.forEach(b => b.disabled = true);
  $('j-acao').innerHTML = '<div class="suspense-txt">Será que acertou?</div>';

  // Momento 1: suspense — alternativa pisca em laranja 3x (~2s)
  const escolhida = botoes[jogo.sel];
  void escolhida.offsetWidth;
  escolhida.classList.add('pisca');
  const [{ res, erro }] = await Promise.all([enviarResposta(jogo.sel), espera(2050)]);
  if(sessao !== jogo.sessao) return;
  escolhida.classList.remove('pisca');
  if(erro) return erroPartida(erro);
  await revelar(res, sessao);
}

/* Tempo acabou: o servidor confirma, 0 pontos e a partida termina */
async function tempoEsgotado(){
  if(jogo.fase !== 'pergunta') return;
  jogo.fase = 'suspense';
  pararTimer();
  $('jogo').classList.remove('urgente');
  $('j-timer').textContent = '0';
  const sessao = jogo.sessao;
  jogo.sel = -1;
  document.querySelectorAll('#j-alts .alt').forEach(b => { b.disabled = true; b.classList.remove('sel'); });
  $('j-acao').innerHTML = '<div class="suspense-txt">Tempo esgotado!</div>';
  const { res, erro } = await enviarResposta(null);
  if(sessao !== jogo.sessao) return;
  if(erro) return erroPartida(erro);
  await revelar(res, sessao);
}

/* Momento 2: revelação do veredicto do servidor */
async function revelar(res, sessao){
  const botoes = document.querySelectorAll('#j-alts .alt');
  const escolhida = botoes[jogo.sel];
  botoes.forEach((b,k) => { if(k !== jogo.sel && k !== res.correta) b.classList.add('apagada'); });
  jogo.fimServidor = res.fim;
  if(res.fim) jogo.acumulado = res.jogador.pontosTotal;
  if(res.acertou){
    escolhida.classList.add('certa');
    jogo.status[jogo.idx] = 'acertou';
    jogo.ganhos[jogo.idx] = res.pontos;
    jogo.acertos = res.acertos;
    mostrarResultado(true, 'Resposta certa!');
    renderLateral();
    await animarPlacar(jogo.placar, res.placar, res.pontos);
    if(sessao !== jogo.sessao) return;
    jogo.placar = res.placar;
  } else if(res.tempoEsgotado){
    jogo.status[jogo.idx] = 'tempo';
    mostrarResultado(false, 'Tempo esgotado!');
    renderLateral();
    await espera(900);
    if(sessao !== jogo.sessao) return;
    botoes[res.correta].classList.add('certa-pisca');
  } else {
    escolhida.classList.add('errada');
    jogo.status[jogo.idx] = 'errou';
    mostrarResultado(false, 'Resposta errada!');
    renderLateral();
    await espera(1100);
    if(sessao !== jogo.sessao) return;
    botoes[res.correta].classList.add('certa-pisca');
  }
  finalizarRodada();
}

function mostrarResultado(ok, msg){
  $('j-acao').innerHTML = `<div class="resultado ${ok?'ok':'ruim'}"><div class="msg">${msg}</div><div id="slot-prox"></div></div>`;
}

/* Mostra o botão de avançar */
function finalizarRodada(){
  jogo.fase = 'revelado';
  const slot = $('slot-prox');
  if(slot) slot.innerHTML = `<button class="btn cheio" id="btn-prox">${jogo.fimServidor ? 'Ver resultado' : 'Próxima pergunta'}</button>`;
  const b = $('btn-prox'); if(b) b.focus();
}

/* Botão "Próxima pergunta": abre a animação da ampulheta; a pergunta e o relógio vêm depois dela */
function proximaPergunta(){
  if(jogo.fase !== 'revelado') return;
  if(jogo.fimServidor){ mostrarFim(); return; }
  abrirPergunta(jogo.idx + 1);
}

/* Momento 3: contador do placar sobe até o novo valor */
function animarPlacar(de, para, pts){
  return new Promise(resolve => {
    const led = $('led-placar'), el = $('j-placar'), g = $('j-ganho');
    g.textContent = '+' + fmt(pts);
    g.classList.remove('vai'); void g.offsetWidth; g.classList.add('vai');
    led.classList.add('sobe');
    const dur = 1800, ini = performance.now();
    const sessao = jogo.sessao;
    (function passo(agora){
      if(sessao !== jogo.sessao){ led.classList.remove('sobe'); return resolve(); }
      const t = Math.min(1, (agora - ini) / dur);
      const e = 1 - Math.pow(1 - t, 3); // ease-out
      el.textContent = fmt(de + (para - de) * e);
      if(t < 1) requestAnimationFrame(passo);
      else { led.classList.remove('sobe'); resolve(); }
    })(ini);
  });
}

/* Lista lateral de perguntas */
function renderLateral(){
  const rot = { pendente:'', acertou:'Acertou', errou:'Errou', tempo:'Tempo' };
  $('j-lista').innerHTML = jogo.status.map((_,i) => {
    const st = jogo.status[i];
    const cls = st !== 'pendente' ? st : (i === jogo.idx ? 'atual' : '');
    const label = st !== 'pendente' ? rot[st] : (i === jogo.idx ? 'Agora' : '');
    const pt = st === 'acertou' ? '+' + fmt(jogo.ganhos[i]) : '';
    return `<li class="${cls}"><span class="n">${i+1}</span><span class="st">${label}</span><span class="pt">${pt}</span></li>`;
  }).join('');
}

/* ---------- Tela final ---------- */
function mostrarFim(){
  pararTimer();
  limparAmpulheta();
  jogo.fase = 'fim';
  $('fim-acum').textContent = fmt(jogo.acumulado);
  const eliminado = jogo.status.includes('errou') || jogo.status.includes('tempo');
  document.querySelector('.fim-titulo').textContent = eliminado ? 'Você perdeu!' : 'Fim de jogo';
  $('fim-nome').textContent = jogo.nome;
  $('fim-pontos').textContent = fmt(jogo.placar);
  $('fim-acertos').textContent = jogo.acertos;
  $('fim-total').textContent = jogo.total;
  mostrarEtapa('fim');
}

$('btn-sair').addEventListener('click', sair);
$('j-alts').addEventListener('click', ev => {
  const b = ev.target.closest('.alt'); if(b && !b.disabled) clicarAlternativa(Number(b.dataset.i));
});
$('j-acao').addEventListener('click', ev => {
  if(ev.target.id === 'btn-prox') proximaPergunta();
  if(ev.target.id === 'btn-erro') sair();
});
$('btn-voltar').addEventListener('click', sair);

/* Início: precisa de um jogador identificado na página inicial */
(async () => {
  let j = null;
  try { j = JSON.parse(sessionStorage.getItem('jogador')); } catch {}
  if(!j || !j.matricula){ location.replace('index.html'); return; }
  jogo.matricula = j.matricula;
  jogo.acumulado = j.pontosTotal;
  let inicio;
  try {
    const e = await api('GET', '/api/estado');
    if(!e.total){ alert('Nenhuma pergunta cadastrada. Use a engrenagem na página inicial.'); location.replace('index.html'); return; }
    jogo.dia = e.dia;
    inicio = await api('POST', '/api/partida/iniciar', { matricula:jogo.matricula, dia:jogo.dia });
  } catch(err){ alert(err.message); location.replace('index.html'); return; }
  Object.assign(config, inicio.config);
  iniciarPartida(j.nome, inicio);
})();
